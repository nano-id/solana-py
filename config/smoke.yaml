exchange:
  id: binance
  fallbacks:
    - bybit
    - okx
  sandbox: false
  enable_rate_limit: true
  quote: USDT
  market_type: spot

universe:
  top_n: 5
  min_quote_volume: 5_000_000
  exclude_bases:
    - USDT
    - USDC
    - BUSD
    - DAI
    - TUSD
    - FDUSD
    - USDE
    - WBTC
    - WETH
    - STETH

ohlcv:
  # Daily bars for EG cointegration checks.
  timeframe: 1d
  # Prefer ≥2y when the venue allows; still subject to exchange history caps.
  lookback_days: 1000
  limit_per_request: 300

storage:
  root: data

cointegration:
  pvalue_threshold: 0.05
  min_obs: 100
  persist_mode: both
  universe_as_of: auto
  price_space: log
