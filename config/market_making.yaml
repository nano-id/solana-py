# Spot-only market making (NO futures / perps).
# commission_pct: 0.07 means 0.07% = 7 bps per filled side.

exchange:
  id: okx
  fallbacks: [bybit, binance]
  quote: USDT
  market_type: spot

storage:
  root: data

market_making:
  symbols:
    - BTC/USDT
    - ETH/USDT
    - BNB/USDT
    - SOL/USDT
    - XRP/USDT
    - DOGE/USDT
    - ADA/USDT
    - TRX/USDT
    - LTC/USDT
    - SUI/USDT
  commission_pct: 0.07
  edge_buffer_bps: 5.0
  min_half_spread_bps: 12.0
  inventory_skew_bps: 8.0
  target_inventory: 0.0
  max_inventory: 1.0
  size_frac_of_max: 0.1
  inventory_halt_frac: 0.95
  vol_lookback: 48
  vol_spread_mult: 0.35
  interpretation_allowed: false
  sim:
    n_bars: 2000
    seed: 42
    mid0: 100.0
    ann_vol: 0.55
    fill_prob: 0.80
    adverse_frac: 0.15
    bars_per_year: 8760
